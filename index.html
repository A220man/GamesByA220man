<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Battleship Yamato: Faction Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #010409;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.05) 2%, transparent 20%),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.05) 2%, transparent 20%);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            aspect-ratio: 1 / 1;
        }
        
        .tile {
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s;
            border: 2px solid transparent;
            border-radius: 8px;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
            pointer-events: none; /* Make sure click goes to the parent div */
        }
        
        .tile.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px #38bdf8;
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.2);
        }

        .tile.match {
            animation: match-animation 0.5s forwards;
        }
        
        @keyframes match-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(15deg); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .ship-display-card {
             background: linear-gradient(145deg, #1f2937, #111827);
             border-image: linear-gradient(to right, #4f46e5, #ec4899) 1;
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-4">
            <h1 class="text-3xl md:text-5xl font-bold text-cyan-400 tracking-widest" style="text-shadow: 0 0 10px #0891b2;">FACTION MATCH</h1>
            <p class="text-sm text-gray-400">Swap logos to match 3 or more in a row</p>
        </header>

        <main class="flex flex-col md:flex-row gap-4">
            <!-- Game Board -->
            <div id="game-container" class="w-full md:w-2/3 flex items-center justify-center">
                <div id="game-board" class="p-2 bg-black bg-opacity-30 rounded-lg border border-gray-700">
                    <!-- Tiles will be generated by JavaScript -->
                </div>
            </div>

            <!-- Game Info & Ship Display -->
            <div class="w-full md:w-1/3 flex flex-col gap-4">
                <div class="bg-gray-900 bg-opacity-50 p-4 rounded-lg border border-gray-700 text-center">
                    <h2 class="text-lg font-bold text-cyan-400">MATCHES</h2>
                    <p id="match-counter" class="text-4xl font-bold text-white">0</p>
                </div>
                
                <div id="ship-display" class="ship-display-card p-4 rounded-lg border-2 border-transparent flex-grow flex flex-col items-center justify-center text-center">
                    <h2 class="text-lg font-bold text-pink-500 mb-2">CURRENT SHIP</h2>
                    <div id="ship-info" class="flex flex-col items-center justify-center h-full">
                       <img id="ship-image" src="" alt="Current Ship" class="mb-4 h-32 object-contain hidden">
                       <p id="ship-name" class="text-2xl font-bold">No Ship Commissioned</p>
                       <p id="ship-class" class="text-gray-400">Reach 5 matches to begin</p>
                    </div>
                </div>

                <button id="reset-button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 shadow-lg shadow-indigo-600/30">
                    RESET FLEET
                </button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameBoard = document.getElementById('game-board');
            const matchCounterEl = document.getElementById('match-counter');
            const resetButton = document.getElementById('reset-button');
            const shipNameEl = document.getElementById('ship-name');
            const shipClassEl = document.getElementById('ship-class');
            const shipImageEl = document.getElementById('ship-image');

            const ROWS = 8;
            const COLS = 8;

            const FACTIONS = {
                uncf: { img: `https://static.wikia.nocookie.net/naval-1945/images/9/9d/UNCF.webp/revision/latest/scale-to-width-down/300?cb=20230705061758` },
                gamilas: { img: `https://static.wikia.nocookie.net/yamato/images/6/6c/Great_Garmillas_Empire_emblem.png/revision/latest/scale-to-width-down/300?cb=20241201170506` },
                gatlantis: { img: `https://static.wikia.nocookie.net/yamato/images/e/e3/Gatlantis_Seal_bg_removed_.png/revision/latest/scale-to-width-down/1200?cb=20241208201913` },
                bolar: { img: `https://static.wikia.nocookie.net/yamato/images/1/1d/Bolar_logo.png/revision/latest/scale-to-width-down/1000?cb=20250802224618` },
                darkNebula: { img: `https://static.wikia.nocookie.net/yamato/images/4/4f/Dezariam_logo_2.png/revision/latest?cb=20250502213537` },
                urup: { img: `https://static.wikia.nocookie.net/project-stardust/images/4/49/GUIA.png/revision/latest?cb=20230505085239` },
            };
            const factionKeys = Object.keys(FACTIONS);

            const SHIPS = [
                { matches: 5, name: 'Murasame', class: 'UNCF Cruiser', img: 'https://static.wikia.nocookie.net/yamato/images/a/aa/Murasamesinks.jpg/revision/latest?cb=20220815064318' },
                { matches: 8, name: 'Kelkapia', class: 'Gamilas Cruiser', img: 'https://ourstarblazers.com/vault-images/feb13/74514.JPG' },
                { matches: 12, name: 'Kukulkan', class: 'Gatlantis Combat Ship', img: 'https://static.wikia.nocookie.net/yamato/images/b/bd/Kukulkan.png/revision/latest?cb=20211004222608' },
                { matches: 15, name: 'Imperial Guard Kelkapia', class: 'Gamilas Imperial Guard Cruiser', img: 'https://ourstarblazers.com/vault-images/July13/Imperialblue06.JPG' },
                { matches: 20, name: 'Kongo', class: 'UNCF Battleship', img: 'https://static.wikia.nocookie.net/yamato/images/9/9d/Kirishima-0.jpg/revision/latest?cb=20150908225556' },
                { matches: 25, name: 'Gaiderol', class: 'Gamilas Battleship', img: 'https://static.wikia.nocookie.net/yamato/images/f/fb/Gaiderol-class_Battleship.png/revision/latest?cb=20140617124702' },
                { matches: 30, name: 'Darold', class: 'Gatlantis Battle Carrier', img: 'https://preview.redd.it/v0d3hai5o5s71.png?width=640&crop=smart&auto=webp&s=15612b69a34c700fad87913d6970c71a38e4d95c' },
                { matches: 35, name: 'Meltoria', class: 'Gamilas Battle Cruiser', img: 'https://static.wikia.nocookie.net/yamato/images/3/3b/EX-178.png/revision/latest?cb=20140910013833' },
                { matches: 40, name: 'Lambea', class: 'Gamilas Multi-deck Carrier', img: 'https://starblazers-yamato.net/3199/mechanic/img/lamber.webp' },
                { matches: 45, name: 'Medalusa', class: 'Gatlantis Annihilation Heavy Battleship', img: 'https://yamato2199.net/about/images/mechanic/mechanic_p6.png' },
                { matches: 50, name: 'Andromeda', class: 'UNCF Dreadnought', img: 'https://static.wikia.nocookie.net/yamato/images/e/e6/Andromeda.png/revision/latest?cb=20171020220913' },
                { matches: 55, name: 'Aldebaran', class: 'UNCF Andromeda-class (Variant)', img: 'https://i.redd.it/there-will-be-a-new-sby-up-date-in-project-stardust-come-in-v0-wtoiddwg61ve1.jpg?width=740&format=pjpg&auto=webp&s=24401dec98bab07366dcb0483729005570d6280b' },
                { matches: 60, name: 'Antares', class: 'UNCF Carrier (Andromeda Variant)', img: 'https://www.ourstarblazers.com/vault-images/feb19/ADXbook14.JPG' },
                { matches: 65, name: 'Ginga', class: 'UNCF Wave Motion Experimental Ship', img: 'https://starblazers-yamato.net/3199/mechanic/img/ginga.png' },
                { matches: 75, name: 'Zoelguut', class: 'Gamilas Super Dreadnought', img: 'https://static.wikia.nocookie.net/yamato/images/6/63/Zoelguut_II.jpg/revision/latest/thumbnail/width/360/height/360?cb=20230401045333' },
                { matches: 85, name: 'Apocalix', class: 'Gatlantis Astro Carrier', img: 'https://static.wikia.nocookie.net/yamato/images/b/b0/Seventh_Mobile_Fleet.jpeg/revision/latest?cb=20230823092145' },
                { matches: 90, name: 'Neu Deusura', class: 'Gamilas Command Ship', img: 'https://yamato2202.net/character_mechanic/img/mecha/img_mecha_2_2.png' },
                { matches: 100, name: 'Yamato', class: 'Space battleship', img: 'https://starblazers-yamato.net/3199/mechanic/img/yamato.png' },
            ];
            
            let board = [];
            let matchCount = 0;
            let selectedTile = null;
            let lockBoard = false;

            function getRandomFaction() {
                return factionKeys[Math.floor(Math.random() * factionKeys.length)];
            }

            function createBoard() {
                for (let r = 0; r < ROWS; r++) {
                    board[r] = [];
                    for (let c = 0; c < COLS; c++) {
                        const tile = document.createElement('div');
                        tile.classList.add('tile');
                        tile.dataset.row = r;
                        tile.dataset.col = c;

                        let faction;
                        do {
                            faction = getRandomFaction();
                        } while (
                            (c >= 2 && board[r][c - 1] === faction && board[r][c - 2] === faction) ||
                            (r >= 2 && board[r - 1][c] === faction && board[r - 2][c] === faction)
                        );
                        
                        board[r][c] = faction;
                        tile.innerHTML = `<img src="${FACTIONS[faction].img}" alt="${faction}">`;
                        gameBoard.appendChild(tile);
                    }
                }
            }

            function handleTileClick(e) {
                if (lockBoard || !e.target.classList.contains('tile')) return;
                
                const clickedTile = e.target;

                if (!selectedTile) {
                    selectedTile = clickedTile;
                    selectedTile.classList.add('selected');
                    return;
                }

                if (selectedTile === clickedTile) {
                    selectedTile.classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                // Check if adjacent
                const r1 = parseInt(selectedTile.dataset.row);
                const c1 = parseInt(selectedTile.dataset.col);
                const r2 = parseInt(clickedTile.dataset.row);
                const c2 = parseInt(clickedTile.dataset.col);

                const isAdjacent = Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
                
                if (isAdjacent) {
                    swapTiles(selectedTile, clickedTile);
                } else {
                    selectedTile.classList.remove('selected');
                    selectedTile = clickedTile;
                    selectedTile.classList.add('selected');
                }
            }
            
            async function swapTiles(tile1, tile2) {
                if (lockBoard) return;
                lockBoard = true;
                
                if(selectedTile) selectedTile.classList.remove('selected');
                selectedTile = null;

                const r1 = parseInt(tile1.dataset.row), c1 = parseInt(tile1.dataset.col);
                const r2 = parseInt(tile2.dataset.row), c2 = parseInt(tile2.dataset.col);

                // Swap in board array
                [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
                
                // Swap visually
                const tempSrc = tile1.querySelector('img').src;
                tile1.querySelector('img').src = tile2.querySelector('img').src;
                tile2.querySelector('img').src = tempSrc;

                const matches = findMatches();
                if (matches.length > 0) {
                    await processGameLoop();
                } else {
                    // Invalid move, swap back
                    [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
                    const tempSrc2 = tile1.querySelector('img').src;
                    tile1.querySelector('img').src = tile2.querySelector('img').src;
                    tile2.querySelector('img').src = tempSrc2;
                }
                
                lockBoard = false;
            }
            
            function findMatches() {
                const matches = new Set();
                // Horizontal
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS - 2; c++) {
                        if (board[r][c] && board[r][c] === board[r][c + 1] && board[r][c] === board[r][c + 2]) {
                            for(let i=0; i < 3; i++) matches.add(`${r}-${c+i}`);
                        }
                    }
                }
                // Vertical
                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS - 2; r++) {
                        if (board[r][c] && board[r][c] === board[r + 1][c] && board[r][c] === board[r + 2][c]) {
                             for(let i=0; i < 3; i++) matches.add(`${r+i}-${c}`);
                        }
                    }
                }
                return Array.from(matches);
            }

            async function processGameLoop(){
                lockBoard = true;
                let matches = findMatches();
                
                while(matches.length > 0) {
                    matchCount += matches.length; // You might want a more nuanced scoring
                    matchCounterEl.textContent = matchCount;
                    updateShipDisplay();

                    await removeMatches(matches);
                    await applyGravity();
                    await fillEmptyTiles();

                    matches = findMatches();
                }
                lockBoard = false;
            }

            function removeMatches(matches) {
                 return new Promise(resolve => {
                    for (const match of matches) {
                        const [r, c] = match.split('-').map(Number);
                        board[r][c] = null;
                        const tile = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                        tile.classList.add('match');
                    }
                    setTimeout(resolve, 500);
                 });
            }

            function applyGravity() {
                return new Promise(resolve => {
                    for (let c = 0; c < COLS; c++) {
                        let writeRow = ROWS - 1;
                        for (let r = ROWS - 1; r >= 0; r--) {
                            if (board[r][c] !== null) {
                                [board[writeRow][c], board[r][c]] = [board[r][c], board[writeRow][c]];
                                writeRow--;
                            }
                        }
                    }
                    redrawBoard();
                    setTimeout(resolve, 300);
                });
            }
            
            function fillEmptyTiles(){
                return new Promise(resolve => {
                    for(let r=0; r < ROWS; r++){
                        for(let c=0; c < COLS; c++){
                            if(board[r][c] === null){
                                board[r][c] = getRandomFaction();
                            }
                        }
                    }
                    redrawBoard();
                    setTimeout(resolve, 300);
                });
            }

            function redrawBoard() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const tile = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                        tile.classList.remove('match');
                        if (board[r][c]) {
                            tile.innerHTML = `<img src="${FACTIONS[board[r][c]].img}" alt="${board[r][c]}">`;
                            tile.style.visibility = 'visible';
                        } else {
                            tile.innerHTML = '';
                            tile.style.visibility = 'hidden';
                        }
                    }
                }
            }
            
            function updateShipDisplay() {
                let currentShip = null;
                for (const ship of SHIPS) {
                    if (matchCount >= ship.matches) {
                        currentShip = ship;
                    } else {
                        break;
                    }
                }

                if (currentShip) {
                    shipImageEl.src = currentShip.img;
                    shipImageEl.alt = currentShip.name;
                    shipImageEl.classList.remove('hidden');
                    shipNameEl.textContent = currentShip.name;
                    shipClassEl.textContent = currentShip.class;
                } else {
                    shipImageEl.classList.add('hidden');
                    shipNameEl.textContent = 'No Ship Commissioned';
                    shipClassEl.textContent = 'Reach 5 matches to begin';
                }
            }

            function resetGame() {
                gameBoard.innerHTML = '';
                board = [];
                matchCount = 0;
                matchCounterEl.textContent = '0';
                selectedTile = null;
                lockBoard = false;
                updateShipDisplay();
                createBoard();
            }

            // --- Initial Setup ---
            resetButton.addEventListener('click', resetGame);
            gameBoard.addEventListener('click', handleTileClick);
            resetGame();
        });
    </script>
</body>
</html>
