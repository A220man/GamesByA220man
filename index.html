<!DOCTYPE html>
<html lang="en">
<head>

        <div class="flex justify-center gap-4">

            <a href="tutorial.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 px-8 rounded-lg transition-colors text-xl shadow-lg">
