<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Subway Train Match Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'BIZ UDPGothic', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card .front, .card .back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card .back {
            transform: rotateY(180deg);
        }
        .collection-item, .level-button, .main-menu-button {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .collection-item:hover, .level-button:hover, .main-menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a0a0a0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #888;
        }
        #train-info-modal {
            transition: opacity 0.3s ease-in-out;
        }
        .level-button .bg-image {
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-800">Japan Subway Train Match</h1>
            <p class="text-lg text-gray-600 mt-2">日本地下鉄電車マッチ</p>
        </header>

        <!-- Main Menu Screen -->
        <div id="main-menu-screen" class="text-center bg-white p-8 rounded-2xl shadow-lg">
            <h2 class="text-3xl font-bold mb-8">Main Menu</h2>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
                <button id="play-button" class="main-menu-button w-full sm:w-48 bg-indigo-600 text-white px-6 py-3 rounded-lg text-xl font-semibold hover:bg-indigo-700 transition">Play</button>
                <button id="collection-button" class="main-menu-button w-full sm:w-48 bg-emerald-500 text-white px-6 py-3 rounded-lg text-xl font-semibold hover:bg-emerald-600 transition">Collection</button>
            </div>
        </div>

        <!-- City Selection Screen -->
        <div id="city-selection-screen" class="hidden text-center bg-white p-8 rounded-2xl shadow-lg">
             <div class="flex justify-between items-center mb-6">
                 <h2 class="text-3xl font-bold">Select a Level</h2>
                 <button id="back-to-main-menu-from-city" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">Main Menu</button>
            </div>
            <div id="city-buttons" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- City buttons will be generated here -->
            </div>
        </div>
        
        <!-- Company Selection Screen -->
        <div id="company-selection-screen" class="hidden text-center bg-white p-8 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-6">
                 <h2 id="company-selection-title" class="text-3xl font-bold">Select a Company</h2>
                 <button id="back-to-cities-button" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">Back to Cities</button>
            </div>
            <div id="company-buttons" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Company buttons will be generated here -->
            </div>
        </div>

        <!-- Line Selection Screen -->
        <div id="line-selection-screen" class="hidden text-center bg-white p-8 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-6">
                 <h2 id="line-selection-title" class="text-3xl font-bold">Select a Line</h2>
                 <button id="back-to-companies-button" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">Back to Companies</button>
            </div>
            <div id="line-buttons" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Line buttons will be generated here -->
            </div>
        </div>

        <!-- Main Game Screen -->
        <main id="game-screen" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 id="game-board-title" class="text-2xl font-semibold">Game Board</h2>
                        <p id="current-level-info" class="text-gray-500"></p>
                    </div>
                    <button id="change-level-button" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors duration-300 shadow-md">Main Menu</button>
                </div>
                <div id="game-board" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-3 sm:gap-4"></div>
                 <div id="win-message" class="hidden text-center mt-6 p-4 bg-green-100 text-green-800 rounded-lg">
                    <p class="font-bold text-xl">Congratulations! You've collected all the trains!</p>
                </div>
            </div>
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Trains Collected This Round</h2>
                <div id="collection-section" class="custom-scrollbar h-96 overflow-y-auto grid grid-cols-2 gap-4 p-2 bg-gray-50 rounded-lg"></div>
            </div>
        </main>

        <!-- Collection Screen -->
        <div id="collection-screen" class="hidden bg-white p-8 rounded-2xl shadow-lg">
             <div class="flex justify-between items-center mb-6">
                 <h2 class="text-3xl font-bold">My Train Collection</h2>
                 <button id="back-to-main-menu-from-collection" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">Main Menu</button>
            </div>
            <div id="master-collection-grid" class="custom-scrollbar grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 max-h-[70vh] overflow-y-auto p-4 bg-gray-50 rounded-lg">
                <!-- Master collection will be displayed here -->
            </div>
        </div>

    </div>

    <!-- Train Info Modal -->
    <div id="train-info-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="p-6">
                <div class="flex justify-between items-start">
                    <h3 id="modal-train-name" class="text-2xl font-bold mb-2">Train Name</h3>
                    <button id="modal-close-button" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
                </div>
                <p id="modal-train-operator" class="text-md text-gray-600 mb-4">Operator</p>
                <div id="modal-train-images-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <!-- Train images will be dynamically inserted here -->
                </div>
                <p id="modal-train-description" class="text-gray-700">Description goes here.</p>
            </div>
        </div>
    </div>

            let masterCollection = [];
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let canFlip = true;
            let currentCity = null;
            let currentCompany = null;
            let currentLevelData = null;

            function switchScreen(screenToShow) {
                [mainMenuScreen, citySelectionScreen, companySelectionScreen, lineSelectionScreen, gameScreen, collectionScreen].forEach(screen => screen.classList.add('hidden'));
                screenToShow.classList.remove('hidden');
            }

            function showMainMenu() {
                switchScreen(mainMenuScreen);
            }

            function showCitySelection() {
                cityButtonsContainer.innerHTML = '';
                document.getElementById('city-selection-screen').querySelector('h2').textContent = 'Select a Level';
                for (const levelName in levels) {
                    const levelData = levels[levelName];
                    let count, countLabel;
                    if(levelData.type === 'match_trains'){
                         count = levelData.trains.length;
                         countLabel = "Trains";
                    } else {
                         count = levelData.lines ? Object.keys(levelData.lines).length : Object.keys(levelData.companies).length;
                         countLabel = levelData.lines ? "Lines" : "Companies";
                    }
                    
                    const button = createLevelButton(levelName, levelData.difficulty || 'Varies', levelData.imageUrl, count, countLabel);
                    button.addEventListener('click', () => handleCityClick(levelName));
                    cityButtonsContainer.appendChild(button);
                }
                switchScreen(citySelectionScreen);
            }
            
            function createLevelButton(name, difficulty, imageUrl, count, countLabel) {
                 const button = document.createElement('button');
                 button.className = 'level-button bg-white rounded-xl shadow-md text-left overflow-hidden relative h-48';
                 const finalImageUrl = imageUrl && imageUrl.trim() !== '' ? imageUrl : `https://placehold.co/300x200/e0e7ff/4f46e5?text=${encodeURIComponent(name)}`;

                 button.innerHTML = `
                    <div class="bg-image w-full h-full" style="background-image: url('${finalImageUrl}')"></div>
                    <div class="absolute inset-0 bg-black bg-opacity-40 p-4 flex flex-col justify-end">
                        <h3 class="text-2xl font-bold text-white">${name}</h3>
                        <p class="text-white">${count} ${countLabel}</p>
                        <p class="mt-2 font-semibold ${difficulty === 'Easy' ? 'text-green-400' : difficulty === 'Medium' ? 'text-orange-400' : difficulty === 'Expert' ? 'text-red-400' : 'text-red-400'}">${difficulty}</p>
                    </div>
                 `;
                 return button;
            }

            function handleCityClick(city) {
                currentCity = city;
                const cityData = levels[city];
                if (cityData.type === "select_company") {
                    showCompanySelection(city);
                } else {
                    initGame(cityData, `${city}`);
                }
            }

            function showCompanySelection(city) {
                companyButtonsContainer.innerHTML = '';
                document.getElementById('company-selection-title').textContent = `Select a Company in ${city}`;
                const companies = levels[city].companies;
                for (const companyName in companies) {
                    const companyData = companies[companyName];
                    const button = createLevelButton(companyName, companyData.difficulty, companyData.imageUrl, Object.keys(companyData.lines).length, "Lines");
                    button.addEventListener('click', () => handleCompanyClick(city, companyName));
                    companyButtonsContainer.appendChild(button);
                }
                switchScreen(companySelectionScreen);
            }

            function handleCompanyClick(city, companyName) {
                currentCompany = companyName;
                const companyData = levels[city].companies[companyName];
                if (companyData.type === "select_line") {
                    showLineSelection(city, companyName);
                } else {
                    initGame(companyData, `${city} - ${companyName}`);
                }
            }
            
            function showLineSelection(city, companyName) {
                lineButtonsContainer.innerHTML = '';
                 document.getElementById('line-selection-title').textContent = `Select a Line for ${companyName}`;
                const lines = levels[city].companies[companyName].lines;
                for (const lineName in lines) {
                    const lineData = lines[lineName];
                    let count, countLabel;
                    if (lineData.type === 'match_trains') {
                        count = lineData.trains.length;
                        countLabel = "Train Models";
                    } else if (lineData.type === 'match_operators') {
                        count = Object.keys(lineData.operators).length;
                        countLabel = "Operators";
                    } else { // match_lines
                        count = Object.keys(lines[lineName].lines || {}).length > 0 ? Object.keys(lines[lineName].lines).length : lines[lineName].trains.length;
                        countLabel = Object.keys(lines[lineName].lines || {}).length > 0 ? "Lines" : "Train Models";

                    }
                    const button = createLevelButton(lineName, lineData.difficulty, lineData.imageUrl, count, countLabel);
                    button.addEventListener('click', () => {
                         initGame(lineData, `${companyName} - ${lineName}`);
                    });
                    lineButtonsContainer.appendChild(button);
                }
                switchScreen(lineSelectionScreen);
            }


            function initGame(data, levelInfo) {
                currentLevelData = data;
                gameBoardTitle.textContent = levelInfo.split(' - ').pop();
                currentLevelInfo.textContent = levelInfo;

                gameBoard.innerHTML = '';
                collectionSection.innerHTML = '';
                winMessage.classList.add('hidden');
                flippedCards = [];
                matchedPairs = 0;
                canFlip = true;
                
                let cardDeck = [];
                if (data.type === 'match_trains') {
                    cardDeck = data.trains.map(train => train.name);
                } else {
                    const keys = data.lines ? Object.keys(data.lines) : Object.keys(data.operators);
                    cardDeck = keys;
                }

                cards = shuffle([...cardDeck, ...cardDeck]);
                createBoard();
                switchScreen(gameScreen);
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function createBoard() {
                const numCards = cards.length;
                let cols = 'grid-cols-4 sm:grid-cols-5 md:grid-cols-6';
                if (numCards <= 8) cols = 'grid-cols-4';
                else if (numCards <= 12) cols = 'grid-cols-4 sm:grid-cols-6';
                else if (numCards > 20) cols = 'grid-cols-5 sm:grid-cols-7';

                gameBoard.className = `grid ${cols} gap-3 sm:gap-4`;

                cards.forEach((key) => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card', 'relative', 'w-full', 'aspect-square', 'rounded-lg');
                    cardElement.dataset.key = key;

                    const front = document.createElement('div');
                    front.classList.add('front', 'bg-gray-700', 'flex', 'items-center', 'justify-center', 'rounded-lg', 'shadow-md');
                    front.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2z" /></svg>`;
                    
                    const back = document.createElement('div');
                    let info, cardImageUrl, hexColor, trainName;

                    if (currentLevelData.type === 'match_trains') {
                        info = currentLevelData.trains.find(t => t.name === key);
                        trainName = info.name;
                        hexColor = info.hex;
                        cardImageUrl = info.cardImageUrl;
                    } else {
                        const source = currentLevelData.lines || currentLevelData.operators;
                        info = source[key];
                        trainName = key;
                        hexColor = info.hex;
                        // For line/operator levels, find the first available card image from its trains.
                        const firstTrainWithImage = info.trains.find(t => t.cardImageUrl && t.cardImageUrl.trim() !== '');
                        cardImageUrl = firstTrainWithImage ? firstTrainWithImage.cardImageUrl : '';
                    }

                    const finalImageUrl = cardImageUrl && cardImageUrl.trim() !== '' ? cardImageUrl : `https://placehold.co/200x200/FFFFFF/000000?text=${encodeURIComponent(trainName)}`;
                    
                    back.classList.add('back', 'bg-gray-200', 'rounded-lg', 'shadow-lg', 'overflow-hidden', 'relative', 'text-white');
                    back.innerHTML = `
                        <img src="${finalImageUrl}" class="w-full h-full object-cover" alt="${key}" onerror="this.onerror=null;this.src='https://placehold.co/200x200/ccc/FFFFFF?text=Image+Not+Found';">
                        <div class="absolute bottom-0 left-0 right-0 p-1 bg-black bg-opacity-60 text-center">
                            <p class="font-bold text-xs">${key}</p>
                        </div>
                    `;

                    cardElement.appendChild(front);
                    cardElement.appendChild(back);
                    cardElement.addEventListener('click', handleCardClick);
                    gameBoard.appendChild(cardElement);
                });
            }

            function handleCardClick(event) {
                if (!canFlip) return;
                const clickedCard = event.currentTarget;
                if (clickedCard.classList.contains('flipped') || clickedCard.classList.contains('matched')) return;
                clickedCard.classList.add('flipped');
                flippedCards.push(clickedCard);
                if (flippedCards.length === 2) {
                    canFlip = false;
                    checkForMatch();
                }
            }

            function checkForMatch() {
                const [card1, card2] = flippedCards;
                if (card1.dataset.key === card2.dataset.key) {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    addTrainToCollection(card1.dataset.key);
                    resetFlippedCards();
                    if (matchedPairs === cards.length / 2) {
                        winMessage.classList.remove('hidden');
                    }
                } else {
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        resetFlippedCards();
                    }, 1000);
                }
            }
            
            function resetFlippedCards() {
                flippedCards = [];
                canFlip = true;
            }

            function addTrainToCollection(key) {
                let trainObject;

                if (currentLevelData.type === 'match_trains') {
                    trainObject = currentLevelData.trains.find(t => t.name === key);
                } else {
                    const source = currentLevelData.lines || currentLevelData.operators;
                    const info = source[key];
                    const randomTrain = info.trains[Math.floor(Math.random() * info.trains.length)];
                    trainObject = { ...randomTrain, operator: key, color: info.color, hex: info.hex };
                }
                
                if (!trainObject) return; // Safeguard if train object isn't found

                const collectionItem = createCollectionItem(trainObject);
                collectionSection.appendChild(collectionItem);

                if (!masterCollection.some(t => t.name === trainObject.name && t.operator === trainObject.operator)) {
                    masterCollection.push(trainObject);
                }
            }

            function createCollectionItem(trainObject) {
                const collectionItem = document.createElement('div');
                collectionItem.classList.add('collection-item', 'relative', 'rounded-lg', 'shadow-sm', 'text-white', 'text-center', 'overflow-hidden', 'cursor-pointer', 'aspect-square');
                
                // Defensive check for collectionImageUrls
                const imageUrls = trainObject.collectionImageUrls || [];
                const finalImageUrl = imageUrls[0] && imageUrls[0].trim() !== '' ? imageUrls[0] : `https://placehold.co/200x200/${trainObject.hex}/FFFFFF?text=${encodeURIComponent(trainObject.name)}`;
                
                collectionItem.innerHTML = `
                    <img src="${finalImageUrl}" class="w-full h-full object-cover" alt="${trainObject.name}" onerror="this.onerror=null;this.src='https://placehold.co/200x200/ccc/FFFFFF?text=Image+Not+Found';">
                    <div class="absolute bottom-0 left-0 right-0 p-2 bg-black bg-opacity-50">
                        <p class="font-bold text-sm">${trainObject.name}</p>
                        <p class="text-xs opacity-80">${trainObject.operator}</p>
                    </div>
                `;
                collectionItem.addEventListener('click', () => showTrainInfo(trainObject));
                return collectionItem;
            }

            function showCollectionScreen() {
                masterCollectionGrid.innerHTML = '';
                if(masterCollection.length === 0) {
                    masterCollectionGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">You haven't collected any trains yet. Go play!</p>`;
                } else {
                    masterCollection.forEach(train => {
                        const item = createCollectionItem(train);
                        masterCollectionGrid.appendChild(item);
                    });
                }
                switchScreen(collectionScreen);
            }

            function showTrainInfo(trainObject) {
                document.getElementById('modal-train-name').textContent = trainObject.name;
                document.getElementById('modal-train-operator').textContent = trainObject.operator;
                document.getElementById('modal-train-description').textContent = trainObject.description;
                const imagesContainer = document.getElementById('modal-train-images-container');
                imagesContainer.innerHTML = ''; // Clear previous images
                
                const imageUrls = trainObject.collectionImageUrls || [];
                if (imageUrls.length > 0 && imageUrls.some(url => url && url.trim() !== '')) {
                    imageUrls.forEach((url, index) => {
                        const finalImageUrl = url && url.trim() !== '' ? url : `https://placehold.co/400x225/${trainObject.hex}/FFFFFF?text=${encodeURIComponent(trainObject.name)}+Style+${index + 1}`;
                        const img = document.createElement('img');
                        img.src = finalImageUrl;
                        img.alt = `${trainObject.name} style ${index + 1}`;
                        img.classList.add('w-full', 'h-48', 'object-cover', 'rounded-lg', 'bg-gray-200');
                        img.onerror = function() {
                            this.onerror=null;
                            this.src='https://placehold.co/400x225/ccc/FFFFFF?text=Image+Not+Found';
                        };
                        imagesContainer.appendChild(img);
                    });
                } else {
                     const finalImageUrl = `https://placehold.co/400x225/${trainObject.hex}/FFFFFF?text=${encodeURIComponent(trainObject.name)}`;
                     imagesContainer.innerHTML = `<img src="${finalImageUrl}" alt="${trainObject.name}" class="w-full h-48 object-cover rounded-lg bg-gray-200">`;
                }
                
                trainInfoModal.classList.remove('hidden');
                setTimeout(() => trainInfoModal.classList.remove('opacity-0'), 10);
            }

            function hideTrainInfo() {
                trainInfoModal.classList.add('opacity-0');
                setTimeout(() => trainInfoModal.classList.add('hidden'), 300);
            }
            
            // Main Menu Navigation
            playButton.addEventListener('click', showCitySelection);
            collectionButton.addEventListener('click', showCollectionScreen);
            
            // Back Button Navigation
            changeLevelButton.addEventListener('click', showMainMenu);
            backToCitiesButton.addEventListener('click', showCitySelection);
            backToCompaniesButton.addEventListener('click', () => showCompanySelection(currentCity));
            backToMainMenuFromCity.addEventListener('click', showMainMenu);
            backToMainMenuFromCollection.addEventListener('click', showMainMenu);
            
            // Modal close
            modalCloseButton.addEventListener('click', hideTrainInfo);
            trainInfoModal.addEventListener('click', (e) => {
                if (e.target === trainInfoModal) {
                    hideTrainInfo();
                }
            });


            // --- Initial Game Start ---
            showMainMenu();
        });
    </script>
</body>
</html>
