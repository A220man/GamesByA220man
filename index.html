<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintetsu Limited Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #f0f4f8; /* Light blue-gray background */
        }
        .card {
            transform-style: preserve-3d;
            transition: transform 0.5s;
            perspective: 1000px;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .matched {
            border-color: #4ade80; /* Green border for matched cards */
            box-shadow: 0 0 10px #4ade80;
        }
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        /* Kintetsu-inspired colors */
        .kintetsu-blue { background-color: #005aaa; }
        .kintetsu-yellow { color: #f2c500; }
        .kintetsu-header-bg { background: linear-gradient(135deg, #005aaa, #003366); }
        
        /* Styles for the locked collection items */
        .collection-item.locked img {
            filter: grayscale(100%) brightness(70%);
            opacity: 0.8;
        }
        .collection-item.locked p {
            color: #a0aec0; /* A muted gray */
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Main Menu Screen -->
    <div id="main-menu" class="text-center w-full max-w-md mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-800">Kintetsu Limited Express Memory Match</h1>
        <p class="text-lg text-gray-500 mt-1 italic mb-6">From the maker of "Japan Subway Train Match"</p>
        
        <img src="https://www.kintetsu.co.jp/foreign/guidebook/english/images/express-bodies.png" alt="Kintetsu Train" class="rounded-lg shadow-lg mb-8 w-full">

        <div class="space-y-4">
            <button id="play-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 text-xl">Play Game</button>
            <button id="collection-button" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 text-xl">View Collection</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full max-w-3xl">
        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-lg w-full mb-4">
            <div class="flex flex-wrap justify-between items-center text-center">
                 <div class="w-1/3 sm:w-auto mb-2 sm:mb-0">
                    <span class="font-bold text-lg text-gray-700">Moves: </span>
                    <span id="moves-count" class="font-bold text-lg text-blue-600">0</span>
                </div>
                 <div class="w-1/3 sm:w-auto mb-2 sm:mb-0">
                    <span class="font-bold text-lg text-gray-700">Time: </span>
                    <span id="timer" class="font-bold text-lg text-blue-600">0s</span>
                </div>
                 <div class="w-1/3 sm:w-auto">
                    <button class="back-to-menu-btn w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">
                        Menu
                    </button>
                </div>
                <div class="w-full sm:w-auto mt-2 sm:mt-0">
                    <button id="reset-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105">
                        Reset Game
                    </button>
                </div>
            </div>
        </div>
        <div id="game-board" class="grid grid-cols-5 gap-3 sm:gap-4 w-full">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Collection Screen -->
    <div id="collection-screen" class="hidden w-full max-w-4xl">
         <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <h2 class="text-3xl font-bold text-gray-800">Train Collection</h2>
            <div>
                 <button id="reset-collection-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105 mr-2">
                    Reset
                </button>
                <button class="back-to-menu-btn bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105">
                    Back
                </button>
            </div>
        </div>
        <div id="collection-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4 bg-white p-4 rounded-lg shadow-lg">
            <!-- Collection items will be generated here -->
        </div>
    </div>


    <!-- Modal for winning message -->
    <div id="win-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center transform scale-95 transition-transform duration-300">
            <h2 class="text-3xl font-bold text-yellow-500 mb-2">Congratulations!</h2>
            <p class="text-gray-700 text-lg mb-4">You've matched all the Kintetsu trains!</p>
            <p id="win-stats" class="text-gray-600 mb-6"></p>
            <button id="play-again-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-lg transition-transform transform hover:scale-105">
                Play Again
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Screen elements
            const mainMenu = document.getElementById('main-menu');
            const gameScreen = document.getElementById('game-screen');
            const collectionScreen = document.getElementById('collection-screen');
            
            // Button elements
            const playButton = document.getElementById('play-button');
            const collectionButton = document.getElementById('collection-button');
            const backToMenuButtons = document.querySelectorAll('.back-to-menu-btn');
            const resetButton = document.getElementById('reset-button');
            const playAgainButton = document.getElementById('play-again-button');
            const resetCollectionButton = document.getElementById('reset-collection-btn');

            // Game elements
            const gameBoard = document.getElementById('game-board');
            const movesCountSpan = document.getElementById('moves-count');
            const timerSpan = document.getElementById('timer');
            const winModal = document.getElementById('win-modal');
            const winStats = document.getElementById('win-stats');
            const collectionGrid = document.getElementById('collection-grid');

            // --- IMPORTANT: REPLACE THESE WITH YOUR IMAGE URLS ---
            const cardData = [
                { name: 'Shimakaze', img: 'https://upload.wikimedia.org/wikipedia/commons/4/4f/KINTETSU50000_A.JPG' },
                { name: 'Hinotori', img: 'https://www.gk-design.co.jp/wp/wp-content/uploads/2020/03/hinotori-1-scaled-e1610521705609.jpg' },
                { name: 'Urban Liner', img: 'https://upload.wikimedia.org/wikipedia/commons/c/ca/KINTETSU21020_1.JPG' },
                { name: 'Ise-Shima Liner', img: 'https://thumb.photo-ac.com/de/dea37b181de01959587a039de80de86c_t.jpeg' },
                { name: 'Aoniyoshi', img: 'https://www.kintetsu.co.jp/foreign/english/aoniyoshi/images/mv_train_sp.png' },
                { name: 'Vista EX', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/KINTETSU20000_20140121A.jpg/1280px-KINTETSU20000_20140121A.jpg' },
                { name: 'Sakura Liner', img: 'https://upload.wikimedia.org/wikipedia/commons/8/83/Kintetsu_26101_at_Taimadera_Station.JPG' },
                { name: 'Raku', img: 'https://upload.wikimedia.org/wikipedia/commons/3/36/Kintetsu_20000_Series_between_Miminashi_and_Daifuku.jpg' },
                { name: 'Standard', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/191014_1251_%E8%BF%91%E9%89%8416400%E7%B3%BB_%E9%AB%98%E9%B7%B2-%E8%97%A4%E4%BA%95%E5%AF%BA.jpg/1200px-191014_1251_%E8%BF%91%E9%89%8416400%E7%B3%BB_%E9%AB%98%E9%B7%B2-%E8%97%A4%E4%BA%95%E5%AF%BA.jpg' },
                { name: 'Blue Symphony', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Kintetsu16200_yoshinoguchi.jpg/1200px-Kintetsu16200_yoshinoguchi.jpg' },
            ];
            
            let unlockedTrains = [];
            const collectionKey = 'kintetsuUnlockedCollection';

            let cards = [...cardData, ...cardData];
            let flippedCards = [];
            let matchedPairs = 0;
            let moves = 0;
            let lockBoard = false;
            let timerInterval;
            let seconds = 0;
            
            function loadCollection() {
                const savedCollection = localStorage.getItem(collectionKey);
                if (savedCollection) {
                    unlockedTrains = JSON.parse(savedCollection);
                }
            }

            function saveCollection() {
                localStorage.setItem(collectionKey, JSON.stringify(unlockedTrains));
            }

            function showScreen(screenId) {
                mainMenu.classList.add('hidden');
                gameScreen.classList.add('hidden');
                collectionScreen.classList.add('hidden');
                stopTimer();
                document.getElementById(screenId).classList.remove('hidden');
            }

            playButton.addEventListener('click', () => {
                showScreen('game-screen');
                startGame();
            });
            
            collectionButton.addEventListener('click', () => {
                showScreen('collection-screen');
                displayCollection();
            });

            backToMenuButtons.forEach(button => {
                button.addEventListener('click', () => showScreen('main-menu'));
            });
            
            resetCollectionButton.addEventListener('click', () => {
                // We avoid confirm() as it can be blocked. 
                // In a real app, a custom modal would be better.
                unlockedTrains = [];
                saveCollection();
                displayCollection();
            });

            function displayCollection() {
                collectionGrid.innerHTML = ''; // Clear previous items
                cardData.forEach(card => {
                    const isUnlocked = unlockedTrains.includes(card.name);
                    const item = document.createElement('div');
                    item.className = `collection-item text-center ${isUnlocked ? 'unlocked' : 'locked'}`;
                    
                    const cardName = isUnlocked ? card.name : '???';
                    const cardImage = isUnlocked ? card.img : 'https://placehold.co/200x200/e2e8f0/a0aec0?text=?';

                    item.innerHTML = `
                        <img src="${cardImage}" alt="${cardName}" class="w-full h-auto object-cover rounded-lg shadow-md mb-2" onerror="this.onerror=null;this.src='https://placehold.co/200x200/CCCCCC/FFFFFF?text=Error';">
                        <p class="font-semibold text-gray-700">${cardName}</p>
                    `;
                    collectionGrid.appendChild(item);
                });
            }

            function shuffle(array) {
                array.sort(() => Math.random() - 0.5);
            }

            function startGame() {
                matchedPairs = 0;
                moves = 0;
                seconds = 0;
                movesCountSpan.textContent = '0';
                timerSpan.textContent = '0s';
                gameBoard.innerHTML = '';
                lockBoard = false;
                winModal.classList.add('hidden');
                winModal.firstElementChild.classList.remove('scale-100');
                
                shuffle(cards);
                createBoard();
                startTimer();
            }

            function startTimer() {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    seconds++;
                    timerSpan.textContent = `${seconds}s`;
                }, 1000);
            }

            function stopTimer() {
                 clearInterval(timerInterval);
            }
            
            function createBoard() {
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card', 'w-full', 'aspect-square', 'rounded-lg', 'cursor-pointer', 'shadow-md');
                    cardElement.dataset.name = card.name;
                    cardElement.innerHTML = `
                        <div class="card-face card-front w-full h-full rounded-lg kintetsu-blue flex items-center justify-center">
                           <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256" fill="currentColor" class="text-white opacity-80"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96v96a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80Zm-80,68a12,12,0,1,1,12-12A12,12,0,0,1,128,148Zm-32-88a32,32,0,0,1,64,0V80H96Z"/></svg>
                        </div>
                        <div class="card-face card-back w-full h-full rounded-lg bg-white p-1">
                            <img src="${card.img}" alt="${card.name}" class="w-full h-full object-cover rounded-md" onerror="this.onerror=null;this.src='https://placehold.co/200x200/CCCCCC/FFFFFF?text=Image+Error';">
                        </div>
                    `;
                    cardElement.addEventListener('click', () => flipCard(cardElement));
                    gameBoard.appendChild(cardElement);
                });
            }

            function flipCard(cardElement) {
                if (lockBoard || cardElement.classList.contains('flipped') || flippedCards.includes(cardElement)) return;
                cardElement.classList.add('flipped');
                flippedCards.push(cardElement);
                if (flippedCards.length === 2) {
                    lockBoard = true;
                    incrementMoves();
                    checkForMatch();
                }
            }

            function incrementMoves() {
                moves++;
                movesCountSpan.textContent = moves;
            }

            function checkForMatch() {
                const [card1, card2] = flippedCards;
                const isMatch = card1.dataset.name === card2.dataset.name;
                isMatch ? disableCards(card1, card2) : unflipCards(card1, card2);
            }

            function disableCards(card1, card2) {
                card1.removeEventListener('click', flipCard);
                card2.removeEventListener('click', flipCard);
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                const trainName = card1.dataset.name;
                if (!unlockedTrains.includes(trainName)) {
                    unlockedTrains.push(trainName);
                    saveCollection();
                }

                matchedPairs++;
                resetTurn();
                if (matchedPairs === cardData.length) {
                    stopTimer();
                    setTimeout(showWinModal, 500);
                }
            }

            function unflipCards(card1, card2) {
                card1.classList.add('shake');
                card2.classList.add('shake');
                setTimeout(() => {
                    card1.classList.remove('flipped', 'shake');
                    card2.classList.remove('flipped', 'shake');
                    resetTurn();
                }, 1000);
            }

            function resetTurn() {
                flippedCards = [];
                lockBoard = false;
            }

            function showWinModal() {
                winStats.textContent = `You finished in ${moves} moves and ${seconds} seconds!`;
                winModal.classList.remove('hidden');
                setTimeout(() => winModal.firstElementChild.classList.add('scale-100'), 10);
            }
            
            resetButton.addEventListener('click', startGame);
            playAgainButton.addEventListener('click', () => {
                winModal.classList.add('hidden');
                startGame();
            });

            // Load the collection when the app starts
            loadCollection();
        });
    </script>
</body>
</html>
